# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  - package-ecosystem: "julia"
    directories:
      # Location of Julia projects
      - "/"
      - "/docs"
      - "/test"
      - "/lib/LuxCore"
      - "/lib/LuxCore/test"
      - "/lib/LuxCUDA"
      - "/lib/LuxCUDA/test"
      - "/lib/LuxLib"
      - "/lib/LuxLib/test"
      - "/lib/LuxTestUtils"
      - "/lib/LuxTestUtils/test"
      - "/lib/MLDataDevices"
      - "/lib/MLDataDevices/test"
      - "/lib/WeightInitializers"
      - "/lib/WeightInitializers/test"
      # FIXME: seems to take forever to run
      # - "/examples/*"
    schedule:
      interval: "weekly"
