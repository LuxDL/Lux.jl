# Use sparse checkout (which enables `--filter=blob:none` in buildkite-agent)
# so upload/trigger steps avoid downloading the ~500 MB `gh-pages` branch blobs.
checkout:
  sparse:
    paths:
      - ".buildkite/"

steps:
  - label: "Triggering Pipelines (Pull Request)"
    # Skip non-PR branch builds and PRs not targeting main (e.g. stacked PRs);
    # tests will run once the PR is retargeted to main (push a new commit / rebuild).
    if: build.branch != "main" && build.tag == null && build.pull_request.id != null && build.pull_request.base_branch == "main"
    command: ".buildkite/scripts/upload_pipelines.sh"
    agents:
      queue: "upload"

  - label: "Triggering Downstream Pipelines (Pull Request)"
    # Skip non-PR branch builds and PRs not targeting main (e.g. stacked PRs).
    if: build.branch != "main" && build.tag == null && build.pull_request.id != null && build.pull_request.base_branch == "main" && build.pull_request.labels includes "run downstream test"
    command: ".buildkite/scripts/upload_pipelines.sh --downstream"
    agents:
      queue: "upload"

  - label: "Triggering Pipelines (Main Branch)"
    if: build.branch == "main"
    agents:
      queue: "upload"
    command: |
      # Core Lux Testing
      buildkite-agent pipeline upload .buildkite/testing.yml

      # Subpackage testing
      buildkite-agent pipeline upload .buildkite/testing_luxcuda.yml
      buildkite-agent pipeline upload .buildkite/testing_weightinitializers.yml
      buildkite-agent pipeline upload .buildkite/testing_luxlib.yml
      buildkite-agent pipeline upload .buildkite/testing_mldatadevices.yml
      buildkite-agent pipeline upload .buildkite/testing_luxtestutils.yml

      # Disable benchmarks for now
      # # Benchmarks
      # buildkite-agent pipeline upload .buildkite/benchmarks.yml
